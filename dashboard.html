<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Points Dashboard</title>

<!--
  =========================================================================
  Live status dashboard for the Points feature layer (read-only).
  -------------------------------------------------------------------------
  Shows:
    - status counts (completed vs. open)
    - a sortable table of every point (Status, Notes, last edited)
    - a "recent activity" list of the most recently edited points
      (requires editor tracking / EditDate to be enabled on the layer —
      the page detects this automatically and shows a note if it isn't)
    - a small read-only map colored by status

  Auto-refreshes every 30 seconds, plus a manual Refresh button.

  SETUP — same as point-editor.html:
    1. CLIENT_ID: your OAuth 2.0 Client ID (can be the same application
       you registered for the editor, as long as this page's URL is also
       added to that application's redirect URIs).
  =========================================================================
-->

<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
<script src="https://js.arcgis.com/4.29/"></script>

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
  }

  #signInOverlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.97);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
  }
  #signInOverlay h1 { font-size: 18px; margin: 0; }
  #signInBtn {
    background: #0079c1;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
  }
  #signInBtn:hover { background: #00548a; }
  #signInError { color: #c0392b; font-size: 13px; max-width: 360px; text-align: center; }

  #app { display: none; max-width: 1500px; margin: 0 auto; padding: 20px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  header h1 { font-size: 20px; margin: 0; }
  #headerRight { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #555; }
  #editorLink { color: #0079c1; text-decoration: none; font-weight: 600; }
  #editorLink:hover { text-decoration: underline; }
  #refreshBtn {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  #signOutBtn {
    background: none;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }

  #statCards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    padding: 16px;
  }
  .card .num { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .card .label { font-size: 12px; color: #666; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .card.completed .num { color: #2e8540; }
  .card.open .num { color: #c0392b; }
  .card.total .num { color: #0079c1; }

  #mapPanel { position: relative; }

  #mainGrid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 16px;
  }
  @media (max-width: 900px) {
    #mainGrid { grid-template-columns: 1fr; }
  }

  .panel {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px 0; color: #333; }

  #mapDiv { height: 520px; border-radius: 6px; overflow: hidden; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #eee; }
  th { cursor: pointer; color: #444; user-select: none; white-space: nowrap; }
  th:hover { color: #0079c1; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f5f9fc; }
  td.notes { color: #555; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.completed { background: #e3f4e8; color: #206b30; }
  .badge.open { background: #fbe0dd; color: #a12a20; }

  #tableWrap { max-height: 420px; overflow-y: auto; }

  #recentList { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  #recentList li { padding: 8px 0; border-bottom: 1px solid #eee; }
  #recentList li:last-child { border-bottom: none; }
  #recentNote { font-size: 12px; color: #888; }

  #tableError, #recentError { font-size: 12px; color: #c0392b; }
</style>
</head>

<body>
  <div id="signInOverlay">
    <h1>Sign in to view the dashboard</h1>
    <button id="signInBtn">Sign in with ArcGIS Online</button>
    <div id="signInError"></div>
  </div>

  <div id="app">
    <header>
      <h1>Points Dashboard</h1>
      <div id="headerRight">
        <a id="editorLink" href="https://jonp1234.github.io/point_edit/" target="_blank" rel="noopener">Editor</a>
        <span id="lastUpdated"></span>
        <button id="refreshBtn">Refresh</button>
        <span id="userLabel"></span>
        <button id="signOutBtn">Sign out</button>
      </div>
    </header>

    <div id="statCards">
      <div class="card completed"><div class="num" id="countCompleted">-</div><div class="label">Completed</div></div>
      <div class="card open"><div class="num" id="countOpen">-</div><div class="label">Pending</div></div>
      <div class="card total"><div class="num" id="countTotal">-</div><div class="label">Total points</div></div>
    </div>

    <div class="panel" id="mapPanel">
      <h2>Map</h2>
      <div id="mapDiv"></div>
    </div>

    <div id="mainGrid">
      <div class="panel">
        <h2>All points</h2>
        <div id="tableWrap">
          <table>
            <thead>
              <tr>
                <th data-key="Address">Address</th>
                <th data-key="OBJECTID">ID</th>
                <th data-key="Status">Status</th>
                <th data-key="Notes">Notes</th>
                <th data-key="EditDate">Last edited</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="tableError"></div>
      </div>
      <div class="panel">
        <h2>Recent activity</h2>
        <ul id="recentList"></ul>
        <div id="recentNote"></div>
        <div id="recentError"></div>
      </div>
    </div>
  </div>

<script>
require([
  "esri/identity/IdentityManager",
  "esri/identity/OAuthInfo",
  "esri/portal/Portal",
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/FeatureLayer",
  "esri/renderers/UniqueValueRenderer",
  "esri/layers/support/LabelClass",
  "esri/widgets/BasemapGallery",
  "esri/widgets/Expand"
], function (esriId, OAuthInfo, Portal, Map, MapView, FeatureLayer, UniqueValueRenderer, LabelClass, BasemapGallery, Expand) {

  // =========================== CONFIG ===================================
  const CLIENT_ID = "Y4nNFLiG8tQXFLJU";
  const PORTAL_URL = "https://www.arcgis.com"; // change if this is an ArcGIS Enterprise portal
  const FEATURE_LAYER_URL = "https://services9.arcgis.com/zEltomHsPUsr6yNG/arcgis/rest/services/Points/FeatureServer/0";
  const STATUS_FIELD = "Status";
  const NOTES_FIELD = "Notes";
  const ADDRESS_FIELD = "Address";
  const STATUS_COMPLETED_VALUE = "completed";
  const AUTO_REFRESH_SECONDS = 30;
  // ========================================================================

  const oauthInfo = new OAuthInfo({
    appId: CLIENT_ID,
    portalUrl: PORTAL_URL,
    popup: false
  });
  esriId.registerOAuthInfos([oauthInfo]);

  let view, pointsLayer, objectIdField, editDateField = null;
  let allRows = [];
  let sortKey = "OBJECTID";
  let sortDir = 1;

  function showApp() {
    document.getElementById("signInOverlay").style.display = "none";
    document.getElementById("app").style.display = "block";
    initDashboard();
  }

  function showSignIn(errorMsg) {
    document.getElementById("signInOverlay").style.display = "flex";
    document.getElementById("app").style.display = "none";
    document.getElementById("signInError").textContent = errorMsg || "";
  }

  document.getElementById("signInBtn").addEventListener("click", function () {
    if (CLIENT_ID === "REPLACE_WITH_YOUR_CLIENT_ID") {
      document.getElementById("signInError").textContent =
        "This page hasn't been configured with a Client ID yet. Edit CLIENT_ID near the top of the <script> in this file.";
      return;
    }
    esriId.getCredential(PORTAL_URL + "/sharing", { oAuthPopupConfirmation: false })
      .then(onSignedIn)
      .catch(function (err) {
        showSignIn("Sign-in failed: " + (err && err.message ? err.message : err));
      });
  });

  document.getElementById("signOutBtn").addEventListener("click", function () {
    esriId.destroyCredentials();
    window.location.reload();
  });

  function onSignedIn() {
    const portal = new Portal({ url: PORTAL_URL, authMode: "immediate" });
    portal.load().then(function () {
      document.getElementById("userLabel").textContent = portal.user ? portal.user.username : "Signed in";
      showApp();
    });
  }

  esriId.checkSignInStatus(PORTAL_URL + "/sharing")
    .then(onSignedIn)
    .catch(function () {
      showSignIn();
    });

  function initDashboard() {
    if (view) {
      refreshAll();
      return;
    }

    pointsLayer = new FeatureLayer({ url: FEATURE_LAYER_URL, outFields: ["*"] });

    pointsLayer.load().then(function () {
      objectIdField = pointsLayer.objectIdField;
      // Detect whether editor tracking (EditDate) is enabled on the layer
      const editInfo = pointsLayer.editFieldsInfo;
      if (editInfo && editInfo.editDateField) {
        editDateField = editInfo.editDateField;
      }

      pointsLayer.renderer = new UniqueValueRenderer({
        field: STATUS_FIELD,
        defaultSymbol: { type: "simple-marker", color: "#e0a800", size: 9, outline: { color: "white", width: 1 } },
        uniqueValueInfos: [{
          value: STATUS_COMPLETED_VALUE,
          symbol: { type: "simple-marker", color: "#2e8540", size: 9, outline: { color: "white", width: 1 } }
        }]
      });

      pointsLayer.labelingInfo = [new LabelClass({
        labelExpressionInfo: { expression: "$feature." + ADDRESS_FIELD },
        symbol: {
          type: "text",
          color: "#ffdd00",
          haloColor: "#2e8540",
          haloSize: 1,
          font: { size: 10, family: "Arial", weight: "bold" }
        },
        labelPlacement: "above-center",
        deconflictionStrategy: "none" // always show every label, even when points are close together and labels overlap
      })];
      pointsLayer.labelsVisible = true;

      const map = new Map({ basemap: "hybrid", layers: [pointsLayer] }); // "hybrid" = Imagery Hybrid
      view = new MapView({ container: "mapDiv", map: map, zoom: 12, ui: { components: ["zoom"] } });
      view.when(function () {
        view.goTo(pointsLayer.fullExtent).catch(function () {});
      });

      const basemapGallery = new BasemapGallery({ view: view });
      const basemapExpand = new Expand({
        view: view,
        content: basemapGallery,
        expandTooltip: "Change basemap"
      });
      view.ui.add(basemapExpand, "top-right");

      document.querySelectorAll("th[data-key]").forEach(function (th) {
        th.addEventListener("click", function () {
          const key = th.dataset.key;
          if (key === sortKey) {
            sortDir *= -1;
          } else {
            sortKey = key;
            sortDir = 1;
          }
          renderTable();
        });
      });

      document.getElementById("refreshBtn").addEventListener("click", refreshAll);

      refreshAll();
      setInterval(refreshAll, AUTO_REFRESH_SECONDS * 1000);
    }).catch(function (err) {
      document.getElementById("tableError").textContent =
        "Could not load layer: " + (err && err.message ? err.message : err);
    });
  }

  function refreshAll() {
    refreshCounts();
    refreshTable();
    refreshRecent();
    document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString();
  }

  function refreshCounts() {
    const completedQuery = pointsLayer.createQuery();
    completedQuery.where = STATUS_FIELD + " = '" + STATUS_COMPLETED_VALUE + "'";

    const totalQuery = pointsLayer.createQuery();
    totalQuery.where = "1=1";

    Promise.all([
      pointsLayer.queryFeatureCount(completedQuery),
      pointsLayer.queryFeatureCount(totalQuery)
    ]).then(function (results) {
      const completed = results[0];
      const total = results[1];
      document.getElementById("countCompleted").textContent = completed;
      document.getElementById("countOpen").textContent = total - completed;
      document.getElementById("countTotal").textContent = total;
    }).catch(function (err) {
      document.getElementById("tableError").textContent =
        "Could not load counts: " + (err && err.message ? err.message : err);
    });
  }

  function refreshTable() {
    const query = pointsLayer.createQuery();
    query.where = "1=1";
    const outFields = [objectIdField, STATUS_FIELD, NOTES_FIELD, ADDRESS_FIELD];
    if (editDateField) outFields.push(editDateField);
    query.outFields = outFields;
    query.returnGeometry = true; // needed so a table row can zoom the map to it
    query.num = 2000;

    pointsLayer.queryFeatures(query).then(function (result) {
      allRows = result.features.map(function (f) { return { attrs: f.attributes, geometry: f.geometry }; });
      document.getElementById("tableError").textContent = "";
      renderTable();
    }).catch(function (err) {
      document.getElementById("tableError").textContent =
        "Could not load table: " + (err && err.message ? err.message : err);
    });
  }

  function renderTable() {
    const rows = allRows.slice().sort(function (a, b) {
      const key = sortKey === "EditDate" ? editDateField : sortKey;
      let av = a.attrs[key], bv = b.attrs[key];
      if (av == null) av = "";
      if (bv == null) bv = "";
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    rows.forEach(function (row) {
      const attrs = row.attrs;
      const statusVal = (attrs[STATUS_FIELD] || "").toString().toLowerCase();
      const isCompleted = statusVal === STATUS_COMPLETED_VALUE.toLowerCase();
      const tr = document.createElement("tr");
      tr.title = row.geometry ? "Click to zoom to this point on the map" : "No location stored for this point";

      const addressTd = document.createElement("td");
      addressTd.textContent = attrs[ADDRESS_FIELD] || "-";
      tr.appendChild(addressTd);

      const idTd = document.createElement("td");
      idTd.textContent = attrs[objectIdField];
      tr.appendChild(idTd);

      const statusTd = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge " + (isCompleted ? "completed" : "open");
      badge.textContent = isCompleted ? "Completed" : (attrs[STATUS_FIELD] || "Pending");
      statusTd.appendChild(badge);
      tr.appendChild(statusTd);

      const notesTd = document.createElement("td");
      notesTd.className = "notes";
      notesTd.title = attrs[NOTES_FIELD] || "";
      notesTd.textContent = attrs[NOTES_FIELD] || "";
      tr.appendChild(notesTd);

      const editTd = document.createElement("td");
      if (editDateField && attrs[editDateField]) {
        editTd.textContent = new Date(attrs[editDateField]).toLocaleString();
      } else {
        editTd.textContent = "-";
      }
      tr.appendChild(editTd);

      if (row.geometry) {
        tr.addEventListener("click", function () {
          view.goTo({ target: row.geometry, zoom: 17 }, { duration: 500 }).catch(function (err) {
            if (!err || err.name !== "AbortError") console.error("Zoom to point failed:", err);
          });
        });
      }

      tbody.appendChild(tr);
    });
  }

  function refreshRecent() {
    const recentNoteEl = document.getElementById("recentNote");
    const recentListEl = document.getElementById("recentList");
    const recentErrorEl = document.getElementById("recentError");

    if (!editDateField) {
      recentListEl.innerHTML = "";
      recentNoteEl.textContent =
        "Recent activity needs editor tracking enabled on this layer (records who/when edited each feature). " +
        "You can turn this on in the layer's settings in ArcGIS Online (Settings > Editing > Keep track of who created and last updated features).";
      return;
    }
    recentNoteEl.textContent = "";

    const query = pointsLayer.createQuery();
    query.where = "1=1";
    query.outFields = [objectIdField, STATUS_FIELD, NOTES_FIELD, ADDRESS_FIELD, editDateField];
    query.orderByFields = [editDateField + " DESC"];
    query.num = 8;
    query.returnGeometry = false;

    pointsLayer.queryFeatures(query).then(function (result) {
      recentErrorEl.textContent = "";
      recentListEl.innerHTML = "";
      result.features.forEach(function (f) {
        const attrs = f.attributes;
        const statusVal = (attrs[STATUS_FIELD] || "").toString().toLowerCase();
        const isCompleted = statusVal === STATUS_COMPLETED_VALUE.toLowerCase();
        const li = document.createElement("li");
        const when = attrs[editDateField] ? new Date(attrs[editDateField]).toLocaleString() : "";
        const label = attrs[ADDRESS_FIELD] || ("Point " + attrs[objectIdField]);

        const strong = document.createElement("strong");
        strong.textContent = label + " ";
        const badge = document.createElement("span");
        badge.className = "badge " + (isCompleted ? "completed" : "open");
        badge.textContent = isCompleted ? "Completed" : (attrs[STATUS_FIELD] || "Pending");
        const whenDiv = document.createElement("div");
        whenDiv.style.cssText = "color:#888;font-size:12px;";
        whenDiv.textContent = when;

        li.appendChild(strong);
        li.appendChild(badge);
        li.appendChild(whenDiv);
        recentListEl.appendChild(li);
      });
    }).catch(function (err) {
      recentErrorEl.textContent = "Could not load recent activity: " + (err && err.message ? err.message : err);
    });
  }
});
</script>
</body>
</html>
